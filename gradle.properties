# JVM 参数
#
# 注意：这里刻意把堆调小。构建环境（容器）的内存上限是 8GB，
# 而构建期间同时存在 Gradle daemon、Kotlin 编译 daemon、R8 与 lint 数个进程 ——
# 若 daemon 独占 4GB，叠加起来会超过上限，导致 daemon 被 OOM kill
#（现象是 "Gradle build daemon disappeared unexpectedly"）。
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Kotlin 编译 daemon 单独限内存，避免它按默认值要一大块堆
kotlin.daemon.jvmargs=-Xmx1536m

# 关闭并行：资源受限时并行只会让内存峰值更高，收益有限
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
